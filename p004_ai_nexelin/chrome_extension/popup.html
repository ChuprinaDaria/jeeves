<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexelin Web Agent</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 10px;
        min-width: 260px;
        max-width: 320px;
        background: #0f172a;
        color: #e5e7eb;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .small {
        font-size: 11px;
        color: #9ca3af;
      }
      label {
        font-size: 11px;
        display: block;
        margin-bottom: 4px;
      }
      input[type='text'] {
        width: 100%;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid #4b5563;
        background: #020617;
        color: #e5e7eb;
        font-size: 11px;
        box-sizing: border-box;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 8px;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
      }
      .btn-primary {
        background: #2563eb;
        color: #f9fafb;
      }
      .btn-secondary {
        background: #111827;
        color: #e5e7eb;
        border: 1px solid #374151;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .row {
        margin-bottom: 8px;
      }
      .buttons {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .status {
        margin-top: 6px;
        font-size: 11px;
      }
      .status.ok {
        color: #6ee7b7;
      }
      .status.error {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <h1>Nexelin Web Agent</h1>
    <p class="small">
      Work with your <code>X-Client-Token</code> from Nexelin client portal.
    </p>

    <div class="row">
      <label for="clientToken">Client token (tag)</label>
      <input id="clientToken" type="text" placeholder="Paste value from Nexelin portal" />
    </div>
    <div class="row">
      <button id="saveToken" class="btn btn-secondary">Save token</button>
    </div>

    <div class="row">
      <label class="small">Actions for current tab</label>
      <div class="buttons">
        <button id="scrapText" class="btn btn-primary">Scrap text</button>
        <button id="collectMails" class="btn btn-secondary">Collect mails</button>
      </div>
    </div>

    <div id="status" class="status small"></div>

    <script src="popup.js"></script>
  </body>
</html>

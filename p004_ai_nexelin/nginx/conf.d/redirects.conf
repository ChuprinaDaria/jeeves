# Redirect api.nexelin.com to https://mg.nexelin.com/
server {
    listen 80;
    listen [::]:80;
    server_name api.nexelin.com;

    # Redirect all requests to https://mg.nexelin.com/
    return 301 https://mg.nexelin.com$request_uri;
}

# Redirect app.nexelin.com to https://mg.nexelin.com/
server {
    listen 80;
    listen [::]:80;
    server_name app.nexelin.com;

    # Redirect all requests to https://mg.nexelin.com/
    return 301 https://mg.nexelin.com$request_uri;
}

# HTTPS redirects (if SSL certificates are configured)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nexelin.com;

    # SSL configuration (uncomment and configure if you have certificates)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Redirect all requests to https://mg.nexelin.com/
    return 301 https://mg.nexelin.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.nexelin.com;

    # SSL configuration (uncomment and configure if you have certificates)
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    # Redirect all requests to https://mg.nexelin.com/
    return 301 https://mg.nexelin.com$request_uri;
}


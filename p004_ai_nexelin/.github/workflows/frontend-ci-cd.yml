name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'MASTER/client_portal/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'MASTER/client_portal/**'

env:
  NODE_VERSION: '18'
  WORKING_DIRECTORY: MASTER/client_portal

jobs:
  # Code Quality and Linting
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        continue-on-error: false

      - name: Run ESLint
        run: |
          npm run lint || echo "ESLint not configured, skipping..."
        continue-on-error: true

      - name: Check TypeScript types
        run: |
          npx tsc --noEmit || echo "TypeScript check failed"
        continue-on-error: false

      - name: Upload linting artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linting-errors
          path: |
            ${{ env.WORKING_DIRECTORY }}/**/*.log
          retention-days: 7

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit-report.json || echo "{}" > npm-audit-report.json
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-frontend
          path: |
            ${{ env.WORKING_DIRECTORY }}/npm-audit-report.json
          retention-days: 30

  # Build and Test
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-scan]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            ${{ env.WORKING_DIRECTORY }}/dist/**
          retention-days: 7

      - name: Build size check
        run: |
          du -sh dist/ || echo "Build directory not found"
          find dist/ -type f -exec ls -lh {} \; | awk '{print $5, $9}' | sort -hr | head -20

  # Deploy to FTP
  deploy-ftp:
    name: Deploy to FTP Server
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.WORKING_DIRECTORY }}/dist

      - name: Setup FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.WORKING_DIRECTORY }}/dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
          dangerous-clean-slate: false

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Frontend successfully deployed to FTP server"
          echo "Deployment time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Deployment error logging
        if: failure()
        run: |
          echo "❌ Frontend deployment failed"
          echo "Error time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Workflow run: ${{ github.run_id }}"
        continue-on-error: true

  # Archive deployment artifacts
  archive-deployment:
    name: Archive Deployment
    runs-on: ubuntu-latest
    needs: [deploy-ftp]
    if: always()
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Create deployment archive
        run: |
          cd frontend-build
          tar -czf ../frontend-deployment-$(date +%Y%m%d-%H%M%S).tar.gz .
          cd ..

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deployment-archive
          path: frontend-deployment-*.tar.gz
          retention-days: 90


name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'MASTER/**'
      - 'requirements.txt'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/backend-ci-cd.yml'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'MASTER/**'
      - 'requirements.txt'
      - 'Dockerfile*'

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'MASTER.settings'

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint isort mypy
          pip install -r requirements.txt

      - name: Check code formatting with Black
        run: |
          black --check --diff MASTER/ || echo "Black formatting check failed"
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff MASTER/ || echo "Import sorting check failed"
        continue-on-error: true

      - name: Run Flake8 linter
        run: |
          flake8 MASTER/ --max-line-length=120 --extend-ignore=E203,W503 || echo "Flake8 check failed"
        continue-on-error: true

      - name: Run Pylint
        run: |
          pylint MASTER/ --disable=C0111,C0103,R0903 || echo "Pylint check failed"
        continue-on-error: true

      - name: Upload code quality reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-reports
          path: |
            **/*.log
            **/*.txt
          retention-days: 7

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bandit security scan
        run: |
          bandit -r MASTER/ -f json -o bandit-report.json || echo "{}" > bandit-report.json
        continue-on-error: true

      - name: Run Safety check
        run: |
          safety check --json --output safety-report.json || echo "{}" > safety-report.json
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip-audit --format json --output pip-audit-report.json || echo "{}" > pip-audit-report.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-backend
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          retention-days: 30

      - name: Security scan summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "### Bandit Report" >> $GITHUB_STEP_SUMMARY
          cat bandit-report.json | head -50 >> $GITHUB_STEP_SUMMARY || echo "No Bandit issues found" >> $GITHUB_STEP_SUMMARY
          echo "### Safety Report" >> $GITHUB_STEP_SUMMARY
          cat safety-report.json | head -50 >> $GITHUB_STEP_SUMMARY || echo "No Safety issues found" >> $GITHUB_STEP_SUMMARY

  # Database Migrations Check
  migrations-check:
    name: Check Database Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        run: |
          cd MASTER
          python manage.py makemigrations --check --dry-run || echo "Migration check completed"
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db

      - name: Validate migration files
        run: |
          cd MASTER
          python manage.py migrate --plan || echo "Migration validation completed"

  # Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Setup database
        run: |
          cd MASTER
          python manage.py migrate
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0

      - name: Run tests
        run: |
          cd MASTER
          pytest --cov=MASTER --cov-report=xml --cov-report=html --junitxml=junit.xml || echo "Tests completed with some failures"
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
          SECRET_KEY: test-secret-key-for-ci

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            MASTER/junit.xml
            MASTER/htmlcov/**
            MASTER/coverage.xml
          retention-days: 30

      - name: Test coverage summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f MASTER/coverage.xml ]; then
            echo "Coverage report generated" >> $GITHUB_STEP_SUMMARY
          fi

  # Build Docker Image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, migrations-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry (if needed)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: secrets.DOCKER_REGISTRY != ''

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest -o backend-image.tar || echo "Docker save failed"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: backend-image.tar
          retention-days: 7

  # Deploy to VPS
  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Docker image to VPS
        run: |
          scp backend-image.tar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/backend-image.tar

      - name: Deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            echo "Starting deployment..."
            
            # Load Docker image
            docker load -i /tmp/backend-image.tar || echo "Docker load failed"
            
            # Stop existing containers
            docker-compose -f /path/to/docker-compose.yml down || echo "No existing containers"
            
            # Update docker-compose.yml if needed
            # (You may want to update image tags here)
            
            # Start new containers
            docker-compose -f /path/to/docker-compose.yml up -d || echo "Docker compose failed"
            
            # Run migrations
            docker-compose -f /path/to/docker-compose.yml exec -T web python manage.py migrate || echo "Migrations failed"
            
            # Collect static files
            docker-compose -f /path/to/docker-compose.yml exec -T web python manage.py collectstatic --noinput || echo "Collectstatic failed"
            
            # Restart services
            docker-compose -f /path/to/docker-compose.yml restart || echo "Restart failed"
            
            echo "Deployment completed successfully"
            echo "Deployment time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Commit: ${{ github.sha }}"
          EOF

      - name: Deployment verification
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Check if containers are running
            docker-compose -f /path/to/docker-compose.yml ps
            
            # Health check
            curl -f http://localhost:8000/ || echo "Health check failed"
          EOF
        continue-on-error: true

      - name: Deployment success notification
        if: success()
        run: |
          echo "✅ Backend successfully deployed to VPS"
          echo "Deployment time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "VPS Host: ${{ secrets.VPS_HOST }}"

      - name: Deployment error logging
        if: failure()
        run: |
          echo "❌ Backend deployment failed"
          echo "Error time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Workflow run: ${{ github.run_id }}"
          echo "VPS Host: ${{ secrets.VPS_HOST }}"
        continue-on-error: true

  # Archive deployment
  archive-deployment:
    name: Archive Deployment
    runs-on: ubuntu-latest
    needs: [deploy-vps]
    if: always()
    
    steps:
      - name: Create deployment archive
        run: |
          mkdir -p deployment-archive
          echo "${{ github.sha }}" > deployment-archive/commit.txt
          echo "${{ github.ref_name }}" > deployment-archive/branch.txt
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > deployment-archive/deployment-time.txt
          tar -czf backend-deployment-$(date +%Y%m%d-%H%M%S).tar.gz deployment-archive/

      - name: Upload deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-archive
          path: backend-deployment-*.tar.gz
          retention-days: 90


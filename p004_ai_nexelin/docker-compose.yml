

services:
  # ======================== DATABASE =========================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_nexelin_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-admin_db}
      POSTGRES_USER: ${DB_USER:-admin_user}
      POSTGRES_PASSWORD: ${DB_PASS:-admin_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init__db.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_user} -d ${DB_NAME:-admin_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nexelin_network]

  # ========================= REDIS ===========================
  redis:
    image: redis:7-alpine
    container_name: ai_nexelin_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nexelin_network]

  # ========================= BACKEND =========================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_nexelin_web
    restart: unless-stopped
    command: >
      sh -c "gunicorn MASTER.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120"
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: MASTER.settings
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLIENT_PORTAL_BASE_URL: "https://app.nexelin.com"
      WHATSAPP_QR_SECRET: "super_secret_key_9283jd0923jd"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "ollama:host-gateway"
    networks: [nexelin_network]

  # ==================== CELERY WORKER ========================
  celery_worker:
    build:
      context: .
    container_name: ai_nexelin_celery_worker
    restart: unless-stopped
    command: sh -c "celery -A MASTER worker -l info"
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: MASTER.settings
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app
    extra_hosts:
      - "ollama:host-gateway"
    networks: [nexelin_network]

  # ==================== CELERY BEAT ==========================
  celery_beat:
    build:
      context: .
    container_name: ai_nexelin_celery_beat
    restart: unless-stopped
    command: sh -c "celery -A MASTER beat -l info"
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: MASTER.settings
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app
    extra_hosts:
      - "ollama:host-gateway"
    networks: [nexelin_network]

  # ========================= FRONTEND =========================

  # ========================= NGINX ===========================
  nginx:
    image: nginx:alpine
    container_name: ai_nexelin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    networks: [nexelin_network]

  # ================== WHATSAPP BRIDGE ======================
  postgres-mautrix:
    image: postgres:15-alpine
    container_name: ai_nexelin_postgres_mautrix
    restart: unless-stopped
    environment:
      POSTGRES_USER: mautrix
      POSTGRES_PASSWORD: ft9Rulp1V6yOjmGGPyK4Ilw3P33mPkmq
      POSTGRES_DB: mautrix_whatsapp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - mautrix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mautrix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nexelin_network]

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: ai_nexelin_mautrix_whatsapp
    restart: unless-stopped
    depends_on:
      postgres-mautrix:
        condition: service_healthy
    volumes:
      - ./matrix-bridge/mautrix-whatsapp:/data
    ports:
      - "29318:29318"
    extra_hosts:
      - "matrix.nexelin.com:195.201.202.162"
    networks: [nexelin_network]

  # =================== INTEGRATION SERVICE ==================
  integration-service:
    build:
      context: ../services/integration-service
      dockerfile: Dockerfile
    container_name: ai_nexelin_integration_service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL:-https://matrix.org}
      - MATRIX_BOT_USER_ID=${MATRIX_BOT_USER_ID:-}
      - MATRIX_BOT_ACCESS_TOKEN=${MATRIX_BOT_ACCESS_TOKEN:-}
      - DJANGO_API_URL=http://web:8000
      - DJANGO_API_TOKEN=${DJANGO_API_TOKEN:-}
      - PORT=8080
    depends_on:
      - web
    networks: [nexelin_network]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===================== NETWORKS & VOLUMES ====================
networks:
  nexelin_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
  mautrix_postgres_data:

name: Main Branch - Tests & Coverage

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main-tests.yml'

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'Jeeves.settings'
  NODE_VERSION: '20'

jobs:
  # NOTE: the previous per-job paths-filter gating (dorny/paths-filter with
  # fetch-depth: 2) silently evaluated to "false" on merge commits, so the
  # backend/frontend jobs were SKIPPED even when code changed. The
  # workflow-level `paths:` filter above already limits when this workflow
  # runs, so both jobs now run unconditionally.

  # Backend Tests with Coverage
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-xdist coverage

      - name: 🗄️ Setup database
        # python -m django з backend/ замість manage.py з backend/Jeeves:
        # інакше Jeeves/celery.py затіняє пакет celery (sys.path[0] = cwd скрипта)
        run: python -m django migrate --noinput
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          # settings.py читає DB_* змінні (не DATABASE_URL)
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASS: test_pass
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          FIELD_ENCRYPTION_KEY: CnciAdzX7qRbq-xXxmvQwsN-XhDJ95FfpgMbE0wvoxw=
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: 🧪 Run tests with coverage
        run: |
          cd Jeeves
          pytest \
            --cov=Jeeves \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit.xml \
            -v \
            --maxfail=5 \
            -n auto
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASS: test_pass
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          FIELD_ENCRYPTION_KEY: CnciAdzX7qRbq-xXxmvQwsN-XhDJ95FfpgMbE0wvoxw=
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: 📊 Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/Jeeves/coverage.xml
            backend/Jeeves/htmlcov/**
            backend/Jeeves/junit.xml
          retention-days: 30

      - name: 📈 Coverage summary
        run: |
          echo "## 📊 Backend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f Jeeves/coverage.xml ]; then
            echo "✅ Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📁 Coverage files:" >> $GITHUB_STEP_SUMMARY
            echo "- XML: Jeeves/coverage.xml" >> $GITHUB_STEP_SUMMARY
            echo "- HTML: Jeeves/htmlcov/index.html" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🏗️ Build frontend
        run: npm run build:prod

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/**
          retention-days: 7

      - name: ✅ Build summary
        run: |
          echo "## 🏗️ Frontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend build completed successfully" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "📦 Build size: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi


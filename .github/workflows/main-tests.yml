name: Main Branch - Tests & Coverage

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/main-tests.yml'

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'MASTER.settings'
  NODE_VERSION: '20'

jobs:
  # Check what changed
  check-changes:
    name: 🔍 Check Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check changed files
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/main-tests.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/main-tests.yml'

      - name: 📊 Show changes
        run: |
          echo "Backend changed: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"

  # Backend Tests with Coverage
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-xdist coverage

      - name: 🗄️ Setup database
        run: |
          cd MASTER
          python manage.py migrate --noinput
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: 🧪 Run tests with coverage
        run: |
          cd MASTER
          pytest \
            --cov=MASTER \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=junit.xml \
            -v \
            --maxfail=5 \
            -n auto || true
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: 📊 Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/MASTER/coverage.xml
            backend/MASTER/htmlcov/**
            backend/MASTER/junit.xml
          retention-days: 30

      - name: 📈 Coverage summary
        run: |
          echo "## 📊 Backend Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f MASTER/coverage.xml ]; then
            echo "✅ Coverage report generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "📁 Coverage files:" >> $GITHUB_STEP_SUMMARY
            echo "- XML: MASTER/coverage.xml" >> $GITHUB_STEP_SUMMARY
            echo "- HTML: MASTER/htmlcov/index.html" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Frontend Tests
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint || true
        continue-on-error: true

      - name: 🏗️ Build frontend
        run: npm run build:prod

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/**
          retention-days: 7

      - name: ✅ Build summary
        run: |
          echo "## 🏗️ Frontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend build completed successfully" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "📦 Build size: $(du -sh dist | cut -f1)" >> $GITHUB_STEP_SUMMARY
          fi


name: Dev Branch - Deploy Backend & Frontend

on:
  push:
    branches:
      - dev
    paths:
      - 'p004_ai_nexelin/**'
      - 'nextlen/**'
      - '.github/workflows/dev-deploy.yml'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # Check what changed
  check-changes:
    name: 🔍 Check Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Check changed files
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'p004_ai_nexelin/**'
              - '.github/workflows/dev-deploy.yml'
            frontend:
              - 'nextlen/**'
              - '.github/workflows/dev-deploy.yml'

      - name: 📊 Show changes
        run: |
          echo "Backend changed: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"

  # Deploy Backend
  deploy-backend:
    name: 🚀 Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: ./p004_ai_nexelin

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔑 Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 📋 Copy deployment script
        run: |
          chmod +x scripts/deploy-backend-safe.sh
          cat scripts/deploy-backend-safe.sh

      - name: 🚀 Deploy backend
        run: |
          bash scripts/deploy-backend-safe.sh \
            --host ${{ secrets.VPS_HOST }} \
            --user ${{ secrets.VPS_USER }} \
            --compose-path ${{ secrets.VPS_DOCKER_COMPOSE_PATH }} \
            --commit ${{ github.sha }} \
            --branch ${{ github.ref_name }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}

      - name: 🏥 Health check backend
        run: |
          bash scripts/health-check.sh \
            --host ${{ secrets.VPS_HOST }} \
            --user ${{ secrets.VPS_USER }} \
            --url http://${{ secrets.VPS_HOST }}:8000
        continue-on-error: true

      - name: 📝 Deployment log
        if: always()
        run: |
          echo "## 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** ${{ secrets.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # Deploy Frontend
  deploy-frontend:
    name: 🌐 Deploy Frontend to FTP
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ./nextlen

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: nextlen/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: 📋 Copy .htaccess
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/
            echo "✅ .htaccess copied"
          else
            echo "⚠️ .htaccess not found"
          fi

      - name: 📦 Copy static files
        run: |
          if [ -d public/static ]; then
            mkdir -p dist/static
            cp -r public/static/* dist/static/ 2>/dev/null || true
            echo "✅ Static files copied"
          fi

      - name: 🔐 Setup FTP deployment
        run: |
          chmod +x scripts/deploy-ftp-safe.sh
          cat scripts/deploy-ftp-safe.sh

      - name: 📤 Deploy to FTP
        run: |
          bash scripts/deploy-ftp-safe.sh \
            --host ${{ secrets.FTP_HOST }} \
            --user ${{ secrets.FTP_USER }} \
            --pass ${{ secrets.FTP_PASSWORD }} \
            --dir ${{ secrets.FTP_DIR }} \
            --commit ${{ github.sha }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}

      - name: 🏥 Health check frontend
        run: |
          sleep 5
          curl -f -I https://app.nexelin.com/ || echo "⚠️ Frontend health check failed"
        continue-on-error: true

      - name: 📝 Deployment log
        if: always()
        run: |
          echo "## 🌐 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://app.nexelin.com" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY


name: Security Scan

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -c pyproject.toml -r Jeeves/ -f json -o bandit-report.json || true

      - name: Show results
        run: |
          echo "## Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          metrics = data.get('metrics', {}).get('_totals', {})
          results = data.get('results', [])
          high = [r for r in results if r['issue_severity'] == 'HIGH']
          medium = [r for r in results if r['issue_severity'] == 'MEDIUM']
          low = [r for r in results if r['issue_severity'] == 'LOW']
          print(f'| Severity | Count |')
          print(f'|----------|-------|')
          print(f'| HIGH | {len(high)} |')
          print(f'| MEDIUM | {len(medium)} |')
          print(f'| LOW | {len(low)} |')
          if high:
              print()
              print('### High severity issues:')
              for r in high:
                  print(f\"- **{r['test_id']}**: {r['issue_text']} ({r['filename']}:{r['line_number']})\")
          if not high and not medium:
              print()
              print('No high or medium severity issues found.')
          " >> $GITHUB_STEP_SUMMARY

      - name: Fail on high severity
        run: |
          python3 -c "
          import json, sys
          with open('bandit-report.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', []) if r['issue_severity'] == 'HIGH' and r['issue_confidence'] == 'HIGH']
          if high:
              for r in high:
                  print(f\"CRITICAL: {r['test_id']} - {r['issue_text']} in {r['filename']}:{r['line_number']}\")
              sys.exit(1)
          print('No critical issues found.')
          "

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json
          retention-days: 30

  npm-audit:
    name: npm audit (JS dependencies)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "## npm audit results" >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev 2>&1 | tee audit-output.txt || true
          if grep -q "found 0 vulnerabilities" audit-output.txt; then
            echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on critical/high vulnerabilities
        run: npm audit --omit=dev --audit-level=high

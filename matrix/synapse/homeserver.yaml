server_name: "nexelin.com"
pid_file: /data/homeserver.pid
public_baseurl: "https://matrix.nexelin.com/"

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses:
      - "0.0.0.0"
    resources:
      - names: [client, federation]
        compress: false

database:
  name: psycopg2
  allow_unsafe_locale: true
  args:
    user: ${POSTGRES_USER:-synapse}
    password: ${POSTGRES_PASSWORD}
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/data/nexelin.com.log.config"
media_store_path: /data/media_store
signing_key_path: "/data/nexelin.com.signing.key"
registration_shared_secret: "${MATRIX_REGISTRATION_SECRET}"
enable_registration: false
report_stats: false
suppress_key_server_warning: true

app_service_config_files:
  - /data/whatsapp-registration.yaml

homeserver:
  address: https://matrix.nexelin.com
  domain: nexelin.com

appservice:
  address: http://${DJANGO_SERVER_IP}:29318
  hostname: 0.0.0.0
  port: 29318
  id: whatsapp
  bot:
    username: whatsappbot
    displayname: WhatsApp Bridge Bot
  database:
    type: postgres
    uri: postgres://${MAUTRIX_DB_USER:-mautrix}:${MAUTRIX_DB_PASSWORD}@postgres:5432/mautrix_whatsapp?sslmode=disable

bridge:
  username_template: "whatsapp_{{.}}"
  displayname_template: "{{.Name}} (WA)"
  personal_filtering_spaces: true
  delivery_receipts: true
  message_status_events: true
  history_sync:
    create_portals: true
    max_initial_conversations: 50
  provisioning:
    prefix: /_matrix/provision
    shared_secret: ${WHATSAPP_PROVISIONING_SECRET}
  permissions:
    "*": relay
    "@admin:nexelin.com": admin
    "nexelin_client_*@nexelin.com": user
  relay:
    enabled: true

logging:
  min_level: info
  writers:
    - type: stdout
      format: pretty-colored

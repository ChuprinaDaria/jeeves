[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations", "venv", "env", ".venv", "node_modules"]
known_django = "django"
known_first_party = ["MASTER"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "migrations",
    "venv",
    "env",
    ".venv",
    "node_modules",
]

[tool.bandit]
exclude_dirs = ["migrations", "venv", "env", ".venv", "tests", "test"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
# pythonpath makes `from MASTER.xxx import ...` work without needing a
# PYTHONPATH env var. pytest adds these to sys.path before plugins load,
# which is earlier than conftest.py — required because pytest-django
# imports MASTER.settings at plugin load time.
pythonpath = ["."]
testpaths = ["MASTER"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
DJANGO_SETTINGS_MODULE = "MASTER.settings"
django_find_project = false


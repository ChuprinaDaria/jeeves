name: Error Logging and Monitoring

on:
  workflow_run:
    workflows: ["Frontend CI/CD", "Backend CI/CD"]
    types:
      - completed
      - failure

jobs:
  log-errors:
    name: Log Workflow Errors
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./error-logs

      - name: Collect error logs
        run: |
          mkdir -p error-reports
          
          echo "## Error Report - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > error-reports/error-summary.md
          echo "" >> error-reports/error-summary.md
          echo "### Workflow Information" >> error-reports/error-summary.md
          echo "- Workflow: ${{ github.event.workflow_run.name }}" >> error-reports/error-summary.md
          echo "- Run ID: ${{ github.event.workflow_run.id }}" >> error-reports/error-summary.md
          echo "- Commit: ${{ github.event.workflow_run.head_sha }}" >> error-reports/error-summary.md
          echo "- Branch: ${{ github.event.workflow_run.head_branch }}" >> error-reports/error-summary.md
          echo "- Status: ${{ github.event.workflow_run.conclusion }}" >> error-reports/error-summary.md
          echo "" >> error-reports/error-summary.md
          
          # Collect logs from artifacts
          find error-logs -type f -name "*.log" -exec echo "### Log File: {}" >> error-reports/error-summary.md \; -exec head -100 {} >> error-reports/error-summary.md \;

      - name: Upload error report
        uses: actions/upload-artifact@v4
        with:
          name: error-report-${{ github.event.workflow_run.id }}
          path: error-reports/
          retention-days: 90

      - name: Create error summary
        run: |
          echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "Workflow: ${{ github.event.workflow_run.name }}" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.event.workflow_run.id }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.event.workflow_run.head_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Check the error report artifact for details." >> $GITHUB_STEP_SUMMARY


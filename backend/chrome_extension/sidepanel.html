<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Concierge Web Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F0;
        --linen: #F9F3E8;
        --paper: #FFFCF7;
        --mist:  #F3ECDD;
        --ink:   #2D2A26;
        --slate: #6B6560;
        --fog:   #9E9790;
        --rule:  #E8E0D4;
        --rose:  #E8729A;
        --sage:  #7BC89F;
        --iris:  #9B7ED8;
        --iris-soft: #D4C5F0;
        --sage-soft: #C5E8D5;
        --rose-soft: #F5C6D8;
      }
      * { box-sizing: border-box; }
      body {
        font-family: 'Ubuntu', ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        width: 100%;
        min-height: 100vh;
        background: var(--cream);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
        overflow-y: auto;
      }
      h1 {
        font-size: 16px;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .subtitle {
        font-size: 11px;
        color: var(--slate);
        margin: 2px 0 0;
      }
      .mono {
        font-family: 'Ubuntu Mono', ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 10px;
      }
      .card {
        background: var(--paper);
        border: 1.5px solid var(--rule);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 2px 12px rgba(45, 42, 38, 0.06);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .section-title {
        font-family: 'Ubuntu Mono', monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--slate);
        margin: 0 0 8px;
      }
      label {
        font-size: 11px;
        color: var(--slate);
        display: block;
        margin-bottom: 4px;
      }
      input[type='text'], textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1.5px solid var(--rule);
        background: var(--cream);
        color: var(--ink);
        font-size: 12px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input[type='text']:focus, textarea:focus {
        border-color: var(--iris);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Ubuntu Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        transition: all 0.15s ease;
        border: 1.5px solid var(--iris);
        background: transparent;
        color: var(--iris);
        white-space: nowrap;
      }
      .btn:not(:disabled):hover {
        background: var(--iris-soft);
      }
      .btn-primary {
        background: var(--iris);
        color: var(--paper);
      }
      .btn-primary:not(:disabled):hover {
        background: #8463CC;
      }
      .btn-ghost {
        border-color: var(--rule);
        color: var(--slate);
      }
      .btn-ghost:not(:disabled):hover {
        background: var(--mist);
        color: var(--ink);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-full {
        width: 100%;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .badge {
        padding: 3px 10px;
        border-radius: 9999px;
        font-family: 'Ubuntu Mono', monospace;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .badge-ready { background: var(--sage-soft); color: #1F6B43; }
      .badge-warn  { background: var(--rose-soft); color: #8B2549; }
      .domain {
        font-family: 'Ubuntu Mono', monospace;
        font-size: 11px;
        color: var(--iris);
      }
      .status {
        margin-top: 8px;
        font-size: 11px;
        min-height: 14px;
      }
      .status.ok    { color: #1F6B43; }
      .status.error { color: #8B2549; }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        padding: 8px 10px;
        background: var(--linen);
        border-radius: 8px;
      }
      .toggle-row label {
        margin: 0;
        color: var(--ink);
        font-size: 11px;
      }
      .toggle-row input[type='checkbox'] {
        width: 30px;
        height: 16px;
        accent-color: var(--iris);
      }
      .bridge-list { display: flex; flex-direction: column; gap: 6px; }
      .bridge-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        background: var(--linen);
        border: 1.5px solid var(--rule);
        border-radius: 10px;
      }
      .bridge-info { display: flex; align-items: center; gap: 10px; }
      .bridge-icon {
        width: 28px; height: 28px;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700;
        font-size: 13px;
      }
      .ig-icon { background: linear-gradient(135deg, #E8729A, #E8A86D); color: white; }
      .fb-icon { background: #4A6FB8; color: white; }
      .bridge-name { font-size: 12px; font-weight: 500; color: var(--ink); }
      .bridge-sub  { font-size: 10px; color: var(--fog); }
      .progress {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--slate);
      }
      .spinner {
        width: 12px; height: 12px;
        border-radius: 9999px;
        border: 2px solid var(--rule);
        border-top-color: var(--iris);
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .muted {
        font-size: 10px;
        color: var(--fog);
        margin-top: 4px;
      }
      .divider {
        height: 1.5px;
        background: var(--rule);
        margin: 12px -14px;
      }
      #chatMessages {
        max-height: 200px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 10px;
        border: 1.5px solid var(--rule);
        background: var(--cream);
        font-size: 12px;
        line-height: 1.5;
      }
      .chat-msg { margin-bottom: 8px; }
      .chat-role {
        font-family: 'Ubuntu Mono', monospace;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 2px;
      }
      .chat-role.user      { color: var(--iris); }
      .chat-role.assistant { color: var(--slate); }
      .chat-content { color: var(--ink); white-space: pre-wrap; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <div>
          <h1>Concierge</h1>
          <p class="subtitle">Web agent · page intelligence</p>
        </div>
        <span class="badge badge-ready" id="connectionStatus">READY</span>
      </div>

      <label for="clientToken">Client token</label>
      <input id="clientToken" type="text" placeholder="paste tag from /integrations" />
      <p class="muted">Concierge Portal → Integrations → Chrome Extension</p>

      <div class="row" style="margin-top: 10px;">
        <button id="saveToken" class="btn btn-primary">Save token</button>
        <button id="openPortal" class="btn btn-ghost">Open portal</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="card">
      <p class="section-title">Connect networks</p>
      <div class="bridge-list">
        <div class="bridge-item">
          <div class="bridge-info">
            <div class="bridge-icon ig-icon">IG</div>
            <div>
              <div class="bridge-name">Instagram DM</div>
              <div class="bridge-sub" id="igSub">via Matrix bridge</div>
            </div>
          </div>
          <button id="connectInstagram" class="btn">Connect</button>
        </div>
        <div class="bridge-item">
          <div class="bridge-info">
            <div class="bridge-icon fb-icon">FB</div>
            <div>
              <div class="bridge-name">Facebook Messenger</div>
              <div class="bridge-sub" id="fbSub">via Matrix bridge</div>
            </div>
          </div>
          <button id="connectFacebook" class="btn">Connect</button>
        </div>
      </div>

      <div id="bridgeProgress" class="progress hidden">
        <div class="spinner"></div>
        <div id="bridgeProgressText">Opening login tab…</div>
      </div>
      <div id="bridgeStatus" class="status"></div>
    </div>

    <div class="card">
      <p class="section-title">Current tab</p>
      <p class="domain" id="currentDomain">detecting…</p>
      <div class="row" style="margin-top: 10px;">
        <button id="scrapText" class="btn btn-primary">Scrap text</button>
        <button id="collectMails" class="btn">Collect mails</button>
      </div>
      <div class="toggle-row">
        <label for="autoMode">Auto mode · run on every page</label>
        <input type="checkbox" id="autoMode" />
      </div>
      <div id="progress" class="progress hidden">
        <div class="spinner"></div>
        <div id="progressText">Working…</div>
      </div>
    </div>

    <div class="card">
      <p class="section-title">Assistant chat</p>
      <div id="chatMessages"></div>
      <label for="chatInput" style="margin-top: 10px;">Message</label>
      <textarea
        id="chatInput"
        rows="2"
        placeholder="Ask about this page, your data, or tasks…"
      ></textarea>
      <div class="row" style="margin-top: 8px;">
        <button id="chatSend" class="btn btn-primary">Send</button>
        <button id="chatMic" class="btn btn-ghost"><span id="chatMicLabel">Voice</span></button>
        <button id="chatSpeak" class="btn btn-ghost">Read last</button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>

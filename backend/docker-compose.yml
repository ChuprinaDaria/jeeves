

services:
  # ======================== DATABASE =========================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jeeves_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-admin_db}
      POSTGRES_USER: ${DB_USER:-admin_user}
      POSTGRES_PASSWORD: ${DB_PASS:-admin_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init__db.sql:/docker-entrypoint-initdb.d/01-init-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin_user} -d ${DB_NAME:-admin_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jeeves_network]

  # ========================= REDIS ===========================
  redis:
    image: redis:7-alpine
    container_name: jeeves_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jeeves_network]

  # ========================= BACKEND =========================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jeeves_web
    restart: unless-stopped
    command: >
      sh -c "gunicorn Jeeves.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120"
    ports:
      - "8000:8000"
    env_file:
      - .env
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: Jeeves.settings
      DEBUG: "${DEBUG:-1}"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CLIENT_PORTAL_BASE_URL: "${CLIENT_PORTAL_BASE_URL:-http://localhost:5173}"
      WHATSAPP_QR_SECRET: "${WHATSAPP_QR_SECRET:-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "ollama:host-gateway"
    networks: [jeeves_network, matrix]

  # ==================== CELERY WORKER ========================
  celery_worker:
    build:
      context: .
    container_name: jeeves_celery_worker
    restart: unless-stopped
    command: sh -c "celery -A Jeeves worker -l info"
    env_file:
      - .env
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: Jeeves.settings
      DEBUG: "${DEBUG:-1}"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app
    extra_hosts:
      - "ollama:host-gateway"
    networks: [jeeves_network]

  # ==================== CELERY BEAT ==========================
  celery_beat:
    build:
      context: .
    container_name: jeeves_celery_beat
    restart: unless-stopped
    command: sh -c "celery -A Jeeves beat -l info"
    env_file:
      - .env
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: Jeeves.settings
      DEBUG: "${DEBUG:-1}"
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      DB_NAME: ${DB_NAME:-admin_db}
      DB_USER: ${DB_USER:-admin_user}
      DB_PASS: ${DB_PASS:-admin_pass}
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - .:/app
    extra_hosts:
      - "ollama:host-gateway"
    networks: [jeeves_network]

  # ========================= FRONTEND =========================

  # ========================= NGINX ===========================
  nginx:
    image: nginx:alpine
    container_name: jeeves_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    networks: [jeeves_network]


# ===================== NETWORKS & VOLUMES ====================
networks:
  jeeves_network:
    driver: bridge
  matrix:
    external: true
    name: matrix_matrix

volumes:
  postgres_data:
  static_volume:
  media_volume:

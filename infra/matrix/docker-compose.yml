version: "3.8"

# Minimal self-hosted Matrix stack for Jeeves.
#
# Service-account bot for Jeeves MCP is created via:
#   docker compose exec synapse register_new_matrix_user \
#     -u jeeves-bot -p <PASSWORD> -a -c /data/homeserver.yaml http://localhost:8008
#
# Copy .env.example -> .env and fill secrets before `docker compose up -d`.

services:
  synapse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_db:/var/lib/postgresql/data
    networks:
      - matrix

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      - synapse-db
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_DOMAIN}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ./synapse:/data
      - ./bridges/mautrix-telegram/registration.yaml:/data/mautrix-telegram-registration.yaml:ro
      - ./bridges/mautrix-whatsapp/registration.yaml:/data/mautrix-whatsapp-registration.yaml:ro
      - ./bridges/mautrix-meta/registration.yaml:/data/mautrix-meta-registration.yaml:ro
    ports:
      # System nginx reverse-proxies matrix.<domain> -> 127.0.0.1:8008
      - "127.0.0.1:8008:8008"
    networks:
      - matrix

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./bridges/mautrix-whatsapp:/data
    environment:
      UID: "1337"
      GID: "1337"
    networks:
      - matrix

  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./bridges/mautrix-telegram:/data
    environment:
      UID: "1337"
      GID: "1337"
    networks:
      - matrix

  mautrix-meta:
    image: dock.mau.dev/mautrix/meta:latest
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ./bridges/mautrix-meta:/data
    environment:
      UID: "1337"
      GID: "1337"
    networks:
      - matrix

volumes:
  synapse_db:

networks:
  matrix:
    driver: bridge

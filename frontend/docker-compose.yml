version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    networks:
      - concierge-network

networks:
  concierge-network:
    external: true


version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    networks:
      - concierge_network

networks:
  concierge_network:
    name: backend_concierge_network
    external: true


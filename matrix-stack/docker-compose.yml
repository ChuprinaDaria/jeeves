services:
  # ============================================
  # DATABASES
  # ============================================

  postgres-synapse:
    image: postgres:15-alpine
    container_name: grot-postgres-synapse
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_SYNAPSE_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres-synapse:/var/lib/postgresql/data
    networks:
      - grot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-mas:
    image: postgres:15-alpine
    container_name: grot-postgres-mas
    restart: unless-stopped
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${POSTGRES_MAS_PASSWORD}
      POSTGRES_DB: mas
    volumes:
      - ./data/postgres-mas:/var/lib/postgresql/data
    networks:
      - grot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-sliding:
    image: postgres:15-alpine
    container_name: grot-postgres-sliding
    restart: unless-stopped
    environment:
      POSTGRES_USER: sliding
      POSTGRES_PASSWORD: ${POSTGRES_SLIDING_PASSWORD}
      POSTGRES_DB: sliding
    volumes:
      - ./data/postgres-sliding:/var/lib/postgresql/data
    networks:
      - grot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sliding"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-mautrix:
    image: postgres:15-alpine
    container_name: grot-postgres-mautrix
    restart: unless-stopped
    environment:
      POSTGRES_USER: mautrix
      POSTGRES_PASSWORD: ${POSTGRES_MAUTRIX_PASSWORD}
      POSTGRES_DB: mautrix_whatsapp
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres-mautrix:/var/lib/postgresql/data
      - ./init-mautrix-dbs.sql:/docker-entrypoint-initdb.d/init-extra-dbs.sql
    ports:
      - "5433:5432"
    networks:
      - grot-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mautrix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # SYNAPSE - Matrix Homeserver
  # ============================================

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: grot-synapse
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres-synapse:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./synapse:/data



  # ============================================
  # MAUTRIX-WHATSAPP - WhatsApp Bridge
  # ============================================

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: grot-mautrix-whatsapp
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres-mautrix:
        condition: service_healthy
    environment:
      POSTGRES_MAUTRIX_PASSWORD: ${POSTGRES_MAUTRIX_PASSWORD}
      WHATSAPP_PROVISIONING_SECRET: ${WHATSAPP_PROVISIONING_SECRET}
    volumes:
      - ./mautrix-whatsapp:/data

  # ============================================
  # MAUTRIX-META-FACEBOOK - Facebook Messenger Bridge
  # ============================================

  mautrix-meta-facebook:
    image: dock.mau.dev/mautrix/meta:latest
    container_name: grot-mautrix-meta-facebook
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres-mautrix:
        condition: service_healthy
    environment:
      POSTGRES_MAUTRIX_PASSWORD: ${POSTGRES_MAUTRIX_PASSWORD}
    volumes:
      - ./meta-facebook:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:29319/_matrix/provision/v3/whoami || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # MAUTRIX-META-INSTAGRAM - Instagram Bridge
  # ============================================

  mautrix-meta-instagram:
    image: dock.mau.dev/mautrix/meta:latest
    container_name: grot-mautrix-meta-instagram
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres-mautrix:
        condition: service_healthy
    environment:
      POSTGRES_MAUTRIX_PASSWORD: ${POSTGRES_MAUTRIX_PASSWORD}
    volumes:
      - ./meta-instagram:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:29320/_matrix/provision/v3/whoami || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # MAUTRIX-LINKEDIN - LinkedIn Bridge
  # ============================================

  mautrix-linkedin:
    image: dock.mau.dev/mautrix/linkedin:latest
    container_name: grot-mautrix-linkedin
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres-mautrix:
        condition: service_healthy
    environment:
      POSTGRES_MAUTRIX_PASSWORD: ${POSTGRES_MAUTRIX_PASSWORD}
    volumes:
      - ./linkedin:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:29321/_matrix/provision/v3/whoami || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # MAS - Matrix Authentication Service
  # ============================================

  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:latest
    container_name: grot-mas
    restart: unless-stopped
    depends_on:
      postgres-mas:
        condition: service_healthy
    environment:
      MAS_CONFIG: /config/config.yaml
    volumes:
      - ./mas:/config
    ports:
      - "8089:8080"
    networks:
      - grot-internal

  # ============================================
  # ELEMENT WEB - Web Client
  # ============================================

  element:
    image: vectorim/element-web:latest
    container_name: grot-element
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    ports:
      - "8081:80"
    networks:
      - grot-internal

  # ============================================
  # SYNAPSE ADMIN - Admin Panel
  # ============================================

#  synapse-admin:
#    image: awesometechnologies/synapse-admin:latest
#    container_name: grot-synapse-admin
#    restart: unless-stopped
#    ports:
#      - "8082:80"
#    networks:
#      - grot-internal

  # ============================================
  # SLIDING SYNC - Fast Sync for Element X
  # ============================================

  sliding-sync:
    image: ghcr.io/matrix-org/sliding-sync:latest
    container_name: grot-sliding-sync
    restart: unless-stopped
    depends_on:
      postgres-sliding:
        condition: service_healthy
    environment:
      SYNCV3_SERVER: http://synapse:8008
      SYNCV3_DB: "postgres://sliding:${POSTGRES_SLIDING_PASSWORD}@postgres-sliding:5432/sliding?sslmode=disable"
      SYNCV3_SECRET: ${SLIDING_SYNC_SECRET}
      SYNCV3_BINDADDR: "0.0.0.0:8009"
    ports:
      - "8009:8009"
    networks:
      - grot-internal

  # ============================================
  # LIVEKIT - Video Conferencing
  # ============================================

  livekit:
    image: livekit/livekit-server:latest
    container_name: grot-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - grot-internal

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    container_name: grot-lk-jwt
    restart: unless-stopped
    environment:
      LIVEKIT_URL: "wss://livekit.grot.de"
      LIVEKIT_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_API_SECRET}
      LK_JWT_PORT: "8080"
    ports:
      - "8083:8080"
    networks:
      - grot-internal

  # ============================================
  # COTURN - TURN/STUN Server
  # ============================================

  coturn:
    image: coturn/coturn:latest
    container_name: grot-coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49252:49152-49252/udp"
    networks:
      - grot-internal

  # ============================================
  # WELL-KNOWN - Static Configuration
  # ============================================

  well-known:
    image: nginx:alpine
    container_name: grot-well-known
    restart: unless-stopped
    volumes:
      - ./well-known/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./well-known/files:/usr/share/nginx/html:ro
    ports:
      - "8084:80"
    networks:
      - grot-internal

networks:
  grot-internal:
    name: grot-internal
    driver: bridge


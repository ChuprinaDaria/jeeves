version: '3.8'

services:
  integration-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: integration-service
    ports:
      - "8080:8080"
    environment:
      - MATRIX_HOMESERVER_URL=${MATRIX_HOMESERVER_URL:-https://matrix.org}
      - MATRIX_BOT_USER_ID=${MATRIX_BOT_USER_ID}
      - MATRIX_BOT_ACCESS_TOKEN=${MATRIX_BOT_ACCESS_TOKEN}
      - DJANGO_API_URL=${DJANGO_API_URL:-http://localhost:8000}
      - DJANGO_API_TOKEN=${DJANGO_API_TOKEN:-}
      - PORT=8080
    restart: unless-stopped
    networks:
      - integration-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  integration-network:
    driver: bridge

